.hero{display:flex;align-items:flex-end;gap:14px;padding:0 16px 14px;background:var(--card)}
.logo{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;margin-top:-38px;border:4px solid var(--card);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.hero h1{margin:0;font-size:22px;letter-spacing:-.01em}
.hero p{margin:2px 0 0;color:var(--mut);font-size:14px}
.stick{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-weight:600;font-size:14px}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
main{max-width:720px;margin:0 auto;padding:6px 14px 130px}
h2{font-size:20px;margin:24px 2px 12px;letter-spacing:-.01em;scroll-margin-top:130px}
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:116px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info b{font-size:16px}
.info span{color:var(--mut);font-size:13.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info em{font-style:normal;font-weight:700;margin-top:auto;padding-top:8px}
.img{position:relative;flex:none;width:96px;height:96px;border-radius:14px;display:grid;place-items:center;font-size:46px}
.add{position:absolute;right:-6px;bottom:-6px;display:flex;align-items:center;background:var(--card);border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.add button{width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--brand);font-size:22px;font-weight:700}
.add b{min-width:20px;text-align:center;font-size:15px}
.cart{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;max-width:696px;margin:0 auto;display:none;justify-content:space-between;align-items:center;padding:16px 20px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(210,60,47,.4)}
.cart i{font-style:normal;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 10px;margin-right:8px}
.veil{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:90%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg button{padding:13px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.seg button.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:6px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}.line .n small{display:block;color:var(--mut)}
.line .add{position:static;box-shadow:none;border:1px solid var(--line)}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
.send{width:100%;padding:17px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:18px;font-weight:800}
.ghost{width:100%;background:none;border:0;color:var(--mut);padding:12px;text-decoration:underline}
#ticket{z-index:7;overflow:auto;padding:20px}
.paper{background:#fff;color:#000;max-width:320px;margin:0 auto;padding:16px;font:15px/1.4 "Courier New",monospace;border-radius:6px;white-space:pre-wrap}
.paper hr{border:0;border-top:1px dashed #000}
.tickets{max-width:680px;margin:0 auto;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tkh{color:#fff;font-weight:800;text-align:center;padding:8px;border-radius:10px 10px 0 0;font-size:15px}
.tkh.pastel{background:#d23c2f}.tkh.suco{background:#e8890c}
.tickets .paper{border-radius:0 0 6px 6px;max-width:none;margin:0}
.tktot{grid-column:1/-1;text-align:center;color:#fff;font-weight:700;font-size:17px}
.ok{max-width:320px;margin:12px auto;display:grid;gap:8px}
.ok button{padding:14px;border-radius:12px;border:0;font-weight:700;background:var(--brand);color:var(--brand-ink)}
</style>
</head>

var qty={},obs={},mode="mesa";
var $=function(i){return document.getElementById(i)};
var brl=function(v){return "R$ "+v.toFixed(2).replace(".",",")};
// FOTOS: dono/supervisor trocam pelo app (📷). Ao "Salvar app com as fotos", elas ficam gravadas aqui.
var FOTOS={}; // fotos fixas
var fotoLocal={};try{fotoLocal=JSON.parse(localStorage.getItem("jp_fotos")||"{}")}catch(e){}
function foto(n){return fotoLocal[n]===""?"":(fotoLocal[n]||FOTOS[n]||"")}
function imgBox(it,k,q){var f=foto(it[0]),ed=window.cur&&cur.r!="func";
  return "<div class='img"+(f?" ph":"")+"' style='background:"+(f?"url("+f+") center/cover,":"radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 60%),")+it[4]+"'>"+(f?"":it[3])+(ed?"<button class='cam' data-cam='"+k+"' type='button' aria-label='Trocar foto'>📷</button>":"")+stepper(k,q)+"</div>"}
function stepper(k,q){return "<div class='add'>"+(q?"<button data-k='"+k+"' data-d='-1' type='button'>−</button><b>"+q+"</b>":"")+"<button data-k='"+k+"' data-d='1' type='button'>+</button></div>"}
function totals(){var n=0,t=0;MENU.forEach(function(g,gi){g.itens.forEach(function(it,ii){var q=qty[gi+"-"+ii]||0;n+=q;t+=q*it[2]})});return[n,t]}
function render(){
  var h="",tb="";
  MENU.forEach(function(g,gi){
    if(g.hide)return; // seção escondida (hide:true)
    tb+="<button data-go='s"+gi+"' type='button'"+(!tb?" class='on'":"")+">"+g.cat+"</button>";
    h+="<h2 id='s"+gi+"'>"+g.cat+"</h2><div class='grid'>";
    g.itens.forEach(function(it,ii){
      var k=gi+"-"+ii,q=qty[k]||0;
      h+="<div class='card'><div class='info'><b>"+it[0]+"</b><span>"+it[1]+"</span><em>"+brl(it[2])+"</em></div>"+
      imgBox(it,k,q)+"</div>";
    });
    h+="</div>";
  });
  if(!$("tabs").innerHTML)$("tabs").innerHTML=tb;
  $("menu").innerHTML=h;
  var x=totals(),n=x[0],t=x[1];
  $("cart").style.display=n?"flex":"none";$("cn").textContent=n;$("ct").textContent=brl(t);$("st").textContent=brl(t);
  var l="";
  MENU.forEach(function(g,gi){g.itens.forEach(function(it,ii){var k=gi+"-"+ii,q=qty[k]||0;if(q)l+="<div class='line'><div class='n'>"+it[0]+"<small>"+brl(it[2]*q)+"</small></div>"+stepper(k,q)+"</div><div class='ob'><input type='text' data-o='"+k+"' placeholder='Observação (ex.: sem tomate, sem milho)' value=\""+(obs[k]||"").replace(/"/g,"&quot;")+"\"><div class='oc'>"+["sem tomate","sem milho","sem cebola","sem ovo"].map(function(x){return "<button type='button' data-ok='"+k+"' data-ov='"+x+"'>"+x+"</button>"}).join("")+"</div></div>"})});
  $("lines").innerHTML=l;
  if(!n)$("veil").style.display="none";
}
function tap(e){var b=e.target.closest("button");if(!b||!b.dataset.k)return;var k=b.dataset.k;qty[k]=Math.max(0,(qty[k]||0)+Number(b.dataset.d));render()}

$("lines").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||!b.dataset.ok)return;var k=b.dataset.ok;obs[k]=(obs[k]?obs[k]+", ":"")+b.dataset.ov;render()});
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  Array.prototype.forEach.call($("tabs").children,function(c){c.className=c==b?"on":""});
  $(b.dataset.go).scrollIntoView({behavior:"smooth"})});
$("cart").onclick=function(){$("veil").style.display="block"};
$("close").onclick=function(){$("veil").style.display="none"};
function setMode(m){mode=m;$("bMesa").className=m=="mesa"?"on":"";$("bLevar").className=m=="levar"?"on":"";$("who").placeholder=m=="mesa"?"Número da mesa":"Nome do cliente"}
$("bMesa").onclick=function(){setMode("mesa")};$("bLevar").onclick=function(){setMode("levar")};
$("clear").onclick=function(){qty={};obs={};render()};
$("send").onclick=function(){
  var who=$("who").value.trim()||(mode=="mesa"?"(sem número)":"(sem nome)");
  var d=new Date(),hh=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  var s="JA-PONA PASTELARIA\n"+hh+"\n<hr>"+(mode=="mesa"?"MESA: ":"LEVAR: ")+who.toUpperCase()+"\n<hr>";
  MENU.forEach(function(g,gi){g.itens.forEach(function(it,ii){var q=qty[gi+"-"+ii]||0;if(q)s+=q+"x "+it[0]+"\n"})});
  s+="<hr>TOTAL: "+brl(totals()[1]);
  $("paper").innerHTML=s;$("ticket").style.display="block";
};
$("back").onclick=function(){$("ticket").style.display="none"};

</script>

<script>
// MESAS E PAGAMENTO
var NM=10,acc={},sales=[],sel=1,view="ped",pay=null,last={};
try{var sv=JSON.parse(localStorage.getItem("jp_pastel")||"{}");acc=sv.acc||{};sales=sv.sales||[]}catch(e){}
try{if(localStorage.getItem("jp_nm_v")!="10"){localStorage.setItem("jp_nm","10");localStorage.setItem("jp_nm_v","10")}NM=Number(localStorage.getItem("jp_nm"))||10}catch(e){}
function saveNM(){try{localStorage.setItem("jp_nm",NM)}catch(e){}}
function save(){try{localStorage.setItem("jp_pastel",JSON.stringify({acc:acc,sales:sales}))}catch(e){}}
function lines(o){var a=[];Object.keys(o).forEach(function(k){var p=k.split("-"),it=(MENU[p[0]]||{itens:[]}).itens[p[1]];if(it)a.push([it[0],o[k],it[2],k])});return a}
function tTot(o){var t=0;lines(o).forEach(function(l){t+=l[1]*l[2]});return t}
function drawPick(){var h="";for(var i=1;i<=NM;i++)h+="<button type='button' data-m='"+i+"' class='"+(acc[i]?"busy":"free")+(i==sel?" sel":"")+"'>"+i+"</button>";$("mpick").innerHTML=h}
var _r=render;render=function(){_r();drawPick();if(view!="ped")$("cart").style.display="none"};
$("mpick").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;sel=Number(b.dataset.m);drawPick()});
setMode=function(m){mode=m;$("bMesa").className=m=="mesa"?"on":"";$("bLevar").className=m=="levar"?"on":"";$("mpick").style.display=m=="mesa"?"grid":"none";$("who").style.display=m=="levar"?"block":"none"};
function renderMesas(){
  var h="<div class='legend'><span>🟢 Livre</span><span>🔴 Ocupada</span></div><div class='mgrid'>";
  for(var i=1;i<=NM;i++){var b=acc[i];h+="<button class='mt "+(b?"busy":"free")+"' data-m='"+i+"' type='button'><span class='nb'>"+i+"</span><small>"+(b?brl(tTot(b.items)):"Livre")+"</small></button>"}
  var td=0,hoje=new Date().toDateString();sales.forEach(function(s){if(new Date(s.t).toDateString()==hoje)td+=s.v});
  var adm=typeof boss=="function"&&window.cur&&boss();
  $("mesas").innerHTML=h+"</div>"+(adm?"<div class='nmctl'><span>Quantidade de mesas: <b>"+NM+"</b></span><button type='button' data-nm='-1'"+(NM<=1||acc[NM]?" disabled":"")+">➖</button><button type='button' data-nm='1'"+(NM>=60?" disabled":"")+">➕</button></div>"+(acc[NM]?"<p class='legend'>Para remover, a mesa "+NM+" precisa estar livre.</p>":""):"")+(window.cur&&cur.r!="func"?"<p class='legend'>Vendido hoje: <b style='color:var(--ink)'>"+brl(td)+"</b></p>":"");
}
function go(v){view=v;$("menu").style.display=v=="ped"?"block":"none";$("mesas").style.display=v=="mesas"?"block":"none";$("tabs").style.display=v=="ped"?"flex":"none";$("vPed").className=v=="ped"?"on":"";$("vMesas").className=v=="mesas"?"on":"";if(v=="mesas")renderMesas();render();window.scrollTo(0,0)}
$("vPed").onclick=function(){go("ped")};$("vMesas").onclick=function(){go("mesas")};
$("mesas").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.nm){var d=Number(b.dataset.nm);if(d<0&&acc[NM])return;NM=Math.max(1,Math.min(60,NM+d));if(sel>NM)sel=1;saveNM();renderMesas();drawPick();return}openTable(Number(b.dataset.m))});
function sheet(h){$("psheet").innerHTML=h;$("pveil").style.display="block"}
function openTable(n){
  var b=acc[n],h="<h3>Mesa "+n+"</h3>";
  if(!b)h+="<p style='color:var(--mut)'>Mesa livre.</p><button class='big' data-a='add' data-m='"+n+"' type='button' style='background:var(--brand)'>➕ Fazer pedido</button>";
  else{lines(b.items).forEach(function(l){h+="<div class='line'><div class='n'>"+l[1]+"x "+l[0]+((b.obs||{})[l[3]]?"<small>📝 "+b.obs[l[3]]+"</small>":"")+"</div><b>"+brl(l[1]*l[2])+"</b></div>"});
    h+="<div class='sum'><span>Total</span><span>"+brl(tTot(b.items))+"</span></div><div class='row2'><button data-a='add' data-m='"+n+"' type='button' style='background:var(--line);color:var(--ink)'>➕ Adicionar</button><button data-a='pay' data-m='"+n+"' type='button' style='background:var(--ok);color:#fff'>💰 Fechar conta</button></div>"}
  sheet(h+"<button class='ghost' data-a='x' type='button'>Fechar</button>");
}
function openPay(title,o,n){pay={title:title,o:o,n:n,m:"",rec:"",tot:tTot(o)};drawPay()}
function drawPay(){
  var h="<h3>Fechar conta · "+pay.title+"</h3>";
  var po=pay.n?(acc[pay.n]||{}).obs||{}:last.obs||{};lines(pay.o).forEach(function(l){h+="<div class='line'><div class='n'>"+l[1]+"x "+l[0]+(po[l[3]]?"<small>📝 "+po[l[3]]+"</small>":"")+"</div><b>"+brl(l[1]*l[2])+"</b></div>"});
  h+="<div class='sum'><span>Total</span><span>"+brl(pay.tot)+"</span></div><b>Forma de pagamento</b><div class='chips'>";
  ["Dinheiro","Pix","Crédito","Débito"].forEach(function(m){h+="<button data-a='m' data-v='"+m+"' class='"+(pay.m==m?"on":"")+"' type='button'>"+m+"</button>"});
  h+="</div>";
  if(pay.m=="Dinheiro")h+="<input id='rec' type='text' inputmode='decimal' placeholder='Valor recebido (R$)' value='"+pay.rec+"'><div class='troco' id='troco'></div>";
  sheet(h+"<button class='big' data-a='ok' type='button'"+(pay.m?"":" disabled")+">✅ Confirmar pagamento</button><button class='ghost' data-a='x' type='button'>Cancelar</button>");
  drawTroco();
}
function recv(){return parseFloat((pay.rec||"").replace(",","."))||0}
function drawTroco(){var i=$("rec");if(!i)return;pay.rec=i.value;var v=recv();$("troco").textContent=v>=pay.tot&&v?"Troco: "+brl(v-pay.tot):(v?"Faltam "+brl(pay.tot-v):"Troco: R$ 0,00")}
function confirmPay(){
  var v=recv();if(pay.m=="Dinheiro"&&v&&v<pay.tot){drawTroco();return}
  var tr=pay.m=="Dinheiro"&&v?v-pay.tot:0;
  sales.push({v:pay.tot,m:pay.m,t:Date.now(),w:pay.title,u:(window.cur?cur.n:"")});if(pay.lv){lv.forEach(function(x){if(x.id==pay.lv)x.pd=true});saveLv();lvBadge();if(view=="levar")renderLv()}if(pay.n)delete acc[pay.n];save();renderMesas();drawPick();
  sheet("<h3>✅ Pagamento recebido</h3><p>"+pay.title+" · "+pay.m+" · <b>"+brl(pay.tot)+"</b></p>"+(tr>0?"<div class='troco'>Dar de troco: "+brl(tr)+"</div>":"")+"<button class='big' data-a='x' type='button'>Pronto</button>");
}
$("psheet").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var a=b.dataset.a,m=Number(b.dataset.m);
  if(a=="x")$("pveil").style.display="none";
  else if(a=="add"){$("pveil").style.display="none";sel=m;setMode("mesa");go("ped")}
  else if(a=="pay")openPay("Mesa "+m,acc[m].items,m);
  else if(a=="m"){pay.m=b.dataset.v;drawPay()}
  else if(a=="ok")confirmPay();
});
$("psheet").addEventListener("input",function(e){if(e.target.id=="rec")drawTroco()});
$("send").onclick=function(){
  var x=totals();if(!x[0])return;
  var d=new Date(),hh=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  var who=mode=="mesa"?"MESA "+sel:"LEVAR: "+($("who").value.trim()||"(sem nome)").toUpperCase();
  // Separa o pedido: bebidas (suco, caldo de cana, outras bebidas) vão para a impressora do SUCO; o resto vai para a do PASTEL
  var sP="",sS="",o={};
  MENU.forEach(function(g,gi){var beb=/suco|caldo|bebida/i.test(g.cat);g.itens.forEach(function(it,ii){var k=gi+"-"+ii,q=qty[k]||0;if(q){var l=q+"x "+it[0]+"\n"+(obs[k]?"<b>&gt;&gt; OBS: "+obs[k].toUpperCase()+"</b>\n":"");if(beb)sS+=l;else sP+=l;o[k]=q}})});
  function tk(cls,titulo,sec,body){return "<div><div class='tkh "+cls+"'>🖨️ "+titulo+"</div><div class='paper'>JA-PONA PASTELARIA\n"+hh+"\n<hr>"+who+"\n<hr><b>"+sec+"</b>\n"+body+"</div></div>"}
  var s=(sP?tk("pastel","Impressora do PASTEL","PASTÉIS",sP):"")+(sS?tk("suco","Impressora do SUCO","BEBIDAS",sS):"");
  var ob={};Object.keys(o).forEach(function(k){if(obs[k])ob[k]=obs[k]});
  if(mode=="mesa"){var tb=acc[sel]||(acc[sel]={items:{},t:Date.now()});tb.obs=tb.obs||{};Object.keys(o).forEach(function(k){tb.items[k]=(tb.items[k]||0)+o[k];if(ob[k])tb.obs[k]=(tb.obs[k]?tb.obs[k]+"; ":"")+ob[k]});save()}
  last={o:o,who:who,obs:ob};
  if(mode=="levar"){var lid=Date.now();lv.push({id:lid,n:($("who").value.trim()||"(sem nome)"),t:lid,o:o,obs:ob,pd:false});saveLv();last.lv=lid;lvBadge()}
  $("paper").innerHTML=s+"<div class='tktot'>Total do pedido: "+brl(x[1])+"</div>";$("ticket").style.display="block";$("charge").style.display=mode=="levar"?"block":"none";
};
var cb=document.createElement("button");cb.id="charge";cb.type="button";cb.textContent="💰 Cobrar agora";$("done").parentNode.insertBefore(cb,$("done"));
function finish(){$("ticket").style.display="none";$("veil").style.display="none";qty={};obs={};$("who").value="";render();renderMesas()}
$("done").onclick=finish;$("back").style.display="none";
cb.onclick=function(){var o=last.o,w=last.who,l=last.lv;finish();openPay(w,o,null);pay.lv=l};
setMode("mesa");render();
</script>
<style>
#lock{margin-left:auto;background:none;border:0;font-size:20px;opacity:.5;padding:8px}
input[type=password]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;letter-spacing:.4em;text-align:center;margin-bottom:6px}
.dsel{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}

.sumg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.sumg b{font-size:17px}

.hist{cursor:pointer}
</style>
<script>
// CAIXA (área do dono)
var sai=[],pin="",owner=false,day=new Date();
try{sai=JSON.parse(localStorage.getItem("jp_pastel_sai")||"[]");pin=localStorage.getItem("jp_pastel_pin")||""}catch(e){}
function saveX(){try{localStorage.setItem("jp_pastel_sai",JSON.stringify(sai));if(pin)localStorage.setItem("jp_pastel_pin",pin)}catch(e){}}
function sum(a){var t=0;a.forEach(function(x){t+=x.v});return t}
function ds(t){return new Date(t).toDateString()}
function hm(t){var d=new Date(t);return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
var DN=["dom","seg","ter","qua","qui","sex","sáb"];
function dl(d){return DN[d.getDay()]+" "+("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)}
function dayData(d){var k=d.toDateString(),e=sales.filter(function(s){return ds(s.t)==k}),s=sai.filter(function(x){return ds(x.t)==k});return{e:e,s:s,te:sum(e),ts:sum(s)}}
function isHoje(){return day.toDateString()==new Date().toDateString()}
function renderCx(){
  var D=dayData(day),hoje=isHoje();
  var h="<div class='dsel'><button data-d='-1' type='button'>‹</button><b>"+(hoje?"Hoje · ":"")+dl(day)+"</b><button data-d='1' type='button'"+(hoje?" disabled":"")+">›</button></div>";
  h+="<div class='sumg'><div><small>Entradas</small><b style='color:var(--ok)'>"+brl(D.te)+"</b></div><div><small>Saídas</small><b style='color:var(--brand)'>"+brl(D.ts)+"</b></div><div><small>Saldo</small><b>"+brl(D.te-D.ts)+"</b></div></div>";
  h+="<div class='ch'>Por forma de pagamento</div><div class='pan'>";
  ["Dinheiro","Pix","Crédito","Débito"].forEach(function(m){h+="<div class='line'><div class='n'>"+m+"</div><b>"+brl(sum(D.e.filter(function(x){return x.m==m})))+"</b></div>"});
  h+="</div><button class='big' id='newS' type='button' style='background:var(--brand);margin-top:12px'>➖ Lançar saída</button>";
  h+="<div class='ch'>Movimentos · "+D.e.length+(D.e.length==1?" venda":" vendas")+"</div><div class='pan'>";
  var mv=D.e.map(function(x){return{t:x.t,n:(x.w||"Venda")+" · "+x.m+(x.u?" · 👤 "+x.u:""),v:x.v}}).concat(D.s.map(function(x){return{t:x.t,n:x.d,v:-x.v,id:x.t}}));
  mv.sort(function(a,b){return b.t-a.t});
  if(!mv.length)h+="<p style='color:var(--mut);margin:10px 0'>Nada lançado neste dia.</p>";
  mv.forEach(function(m){h+="<div class='line'><div class='n'>"+m.n+"<small>"+hm(m.t)+"</small></div><b style='color:"+(m.v<0?"var(--brand)":"var(--ok)")+"'>"+(m.v<0?"− ":"+ ")+brl(Math.abs(m.v))+"</b>"+(m.v<0?"<button class='x' data-del='"+m.id+"' type='button'>✕</button>":"")+"</div>"});
  h+="</div><div class='ch'>Últimos dias</div><div class='pan'>";
  for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var q=dayData(d);h+="<div class='line hist' data-t='"+d.getTime()+"'><div class='n'>"+dl(d)+"<small>"+q.e.length+" vendas"+(q.ts?" · saídas "+brl(q.ts):"")+"</small></div><b>"+brl(q.te-q.ts)+"</b></div>"}
  $("caixa").innerHTML=h+"</div><button class='big' id='team' type='button' style='background:var(--ink);color:var(--bg);margin-top:18px'>👥 Equipe e logins</button>";
}
$("caixa").addEventListener("click",function(e){
  var b=e.target.closest("button"),r=e.target.closest(".hist");
  if(b&&b.dataset.d){day=new Date(day.getTime()+Number(b.dataset.d)*864e5);renderCx()}
  else if(b&&b.dataset.del){sai=sai.filter(function(x){return String(x.t)!=b.dataset.del});saveX();renderCx()}
  else if(b&&b.id=="newS")sheet("<h3>Lançar saída</h3><input id='sd' type='text' placeholder='O que foi? (ex.: massa, gás)' autocomplete='off'><input id='sv2' type='text' inputmode='decimal' placeholder='Valor (R$)'><button class='big' data-a='sok' type='button' style='background:var(--brand)'>Salvar saída</button><button class='ghost' data-a='x' type='button'>Cancelar</button>");
  else if(b&&b.id=="out")lockOut();
  else if(r){day=new Date(Number(r.dataset.t));renderCx()}
});
function pinSheet(){var nova=!pin;sheet("<h3>🔒 Área do dono</h3><p style='color:var(--mut)'>"+(nova?"Crie uma senha de 4 números para proteger o caixa.":"Digite a senha do dono.")+"</p><input id='pn' type='password' inputmode='numeric' maxlength='4' placeholder='••••' autocomplete='off'><div class='troco' id='pe' style='display:none'></div><button class='big' data-a='pin' type='button'>"+(nova?"Criar senha":"Entrar")+"</button><button class='ghost' data-a='x' type='button'>Cancelar</button>")}
function unlock(){owner=true;$("pveil").style.display="none";if(!$("vCx")){var b=document.createElement("button");b.id="vCx";b.type="button";b.textContent="📊 Caixa";b.onclick=function(){go("caixa")};document.querySelector(".views").appendChild(b)}day=new Date();go("caixa")}
function lockOut(){owner=false;var b=$("vCx");if(b)b.remove();go("ped")}
$("lock").onclick=function(){if(owner)go("caixa");else pinSheet()};
$("psheet").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;
  if(a=="pin"){var v=$("pn").value,er=$("pe");
    if(!/^\d{4}$/.test(v)){er.textContent="Use 4 números.";er.style.display="block";return}
    if(!pin){pin=v;saveX();unlock()}else if(v==pin)unlock();else{er.textContent="Senha incorreta.";er.style.display="block"}}
  else if(a=="sok"){var x=parseFloat($("sv2").value.replace(",","."));if(!x||x<=0)return;
    var t=isHoje()?Date.now():new Date(day.getFullYear(),day.getMonth(),day.getDate(),12).getTime();

<script>
// LOGIN E PERMISSÕES — dono, supervisor e funcionário
var users=[],cur=null,lsel=null,lpin="";
var RN={dono:"Dono",sup:"Supervisor",func:"Funcionário"};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ini(n){return esc(n.trim().charAt(0).toUpperCase()||"?")}
try{users=JSON.parse(localStorage.getItem("jp_users")||"[]")}catch(e){}
if(!users.length&&pin)users=[{id:1,n:"Dono",r:"dono",p:pin}];
function saveU(){try{localStorage.setItem("jp_users",JSON.stringify(users))}catch(e){}}
function boss(){return cur&&cur.r!="func"}
var LOGO=document.querySelector(".logo").src;
function drawLogin(){
  var h="<div class='lg'><img src='"+LOGO+"' alt=''><h1>Ja-pona Pastelaria</h1>";
  if(!users.length){
    h+="<p>Primeiro acesso: crie o login do dono.</p><input id='fn' type='text' placeholder='Seu nome' autocomplete='off'><input id='fp' type='password' inputmode='numeric' maxlength='4' placeholder='Senha de 4 números' autocomplete='off'><div class='lerr' id='le'></div><button class='big' id='first' type='button'>Criar e entrar</button>";
  }else if(!lsel){
    h+="<p>Quem está entrando?</p><div class='ulist'>";
    users.forEach(function(u){h+="<button type='button' data-u='"+u.id+"'><span class='av "+u.r+"'>"+ini(u.n)+"</span><span>"+esc(u.n)+"<small>"+RN[u.r]+"</small></span></button>"});
    h+="</div>";
  }else{
    h+="<p>Olá, <b>"+esc(lsel.n)+"</b>! Digite sua senha.</p><div class='dots'>";
    for(var i=0;i<4;i++)h+="<i class='"+(i<lpin.length?"f":"")+"'></i>";
    h+="</div><div class='lerr' id='le'></div><div class='pad'>";
    [1,2,3,4,5,6,7,8,9,"⌫",0,"↩"].forEach(function(k){h+="<button type='button' data-k='"+k+"'>"+k+"</button>"});
    h+="</div><button class='ghost' data-k='↩' type='button'>Trocar de usuário</button>";
  }
  $("login").innerHTML=h+"</div>";$("login").style.display="flex";
}
$("login").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id=="first"){var n=$("fn").value.trim(),p=$("fp").value;
    if(!n){$("le").textContent="Digite seu nome.";return}if(!/^\d{4}$/.test(p)){$("le").textContent="A senha precisa ter 4 números.";return}
    users=[{id:Date.now(),n:n,r:"dono",p:p}];saveU();enter(users[0]);return}
  if(b.dataset.u){lsel=users.filter(function(u){return u.id==b.dataset.u})[0];lpin="";drawLogin();return}
  var k=b.dataset.k;if(k==null)return;
  if(k=="↩"){lsel=null;lpin="";drawLogin();return}
  if(k=="⌫"){lpin=lpin.slice(0,-1);drawLogin();return}
  if(lpin.length<4)lpin+=k;drawLogin();
  if(lpin.length==4){if(lpin==lsel.p)enter(lsel);else{lpin="";drawLogin();$("le").textContent="Senha incorreta."}}
});
function enter(u){
  cur=u;lsel=null;lpin="";$("login").style.display="none";
  try{sessionStorage.setItem("jp_cur",u.id)}catch(e){}
  $("lock").innerHTML="<span class='av "+u.r+"'>"+ini(u.n)+"</span>"+esc(u.n.split(" ")[0]);

  if(!boss()&&c)c.remove();
  go("ped");
}
function logout(){cur=null;owner=false;$("pveil").style.display="none";$("veil").style.display="none";qty={};obs={};render();try{sessionStorage.removeItem("jp_cur")}catch(e){}var c=$("vCx");if(c)c.remove();go("ped");drawLogin()}
$("lock").onclick=function(){
  sheet("<h3>👤 "+esc(cur.n)+"</h3><p style='color:var(--mut)'>"+RN[cur.r]+"</p>"+(boss()?"<button class='big' data-a='uteam' type='button' style='background:var(--ink);color:var(--bg)'>👥 Equipe e logins</button><button class='big' data-a='fexp' type='button' style='background:#2f6fd2'>📤 Salvar app com as fotos</button>":"")+"<button class='big' data-a='uout' type='button' style='background:var(--brand)'>Sair</button><button class='ghost' data-a='x' type='button'>Fechar</button>");
};
// quem pode mexer em quem: dono mexe em todos; supervisor só em funcionários
function canEdit(u){return cur.r=="dono"||(cur.r=="sup"&&u.r=="func")}
function team(){
  var h="<h3>👥 Equipe e logins</h3><p style='color:var(--mut);margin-top:-6px'>"+(cur.r=="dono"?"Você pode criar e alterar qualquer login.":"Você pode criar e alterar logins de funcionários.")+"</p>";
  users.forEach(function(u){h+="<div class='urow'><span class='av "+u.r+"'>"+ini(u.n)+"</span><div class='n'>"+esc(u.n)+(u.id==cur.id?" (você)":"")+"<small>"+RN[u.r]+"</small></div>"+(canEdit(u)?"<button type='button' data-a='uedit' data-id='"+u.id+"'>✏️ Editar</button>":"")+"</div>"});
  sheet(h+"<button class='big' data-a='unew' type='button' style='margin-top:14px'>➕ Novo login</button><button class='ghost' data-a='x' type='button'>Fechar</button>");
}
function uform(u){
  var ops=cur.r=="dono"?["func","sup","dono"]:["func"];
  var h="<h3>"+(u?"Editar login":"Novo login")+"</h3><input id='un' type='text' placeholder='Nome' autocomplete='off' value=\""+(u?esc(u.n):"")+"\">";
  h+="<select id='ur'>"+ops.map(function(r){return "<option value='"+r+"'"+(u&&u.r==r?" selected":"")+">"+RN[r]+"</option>"}).join("")+"</select>";
  h+="<input id='up' type='password' inputmode='numeric' maxlength='4' autocomplete='off' placeholder='"+(u?"Nova senha (deixe vazio p/ manter)":"Senha de 4 números")+"'><div class='troco' id='ue' style='display:none'></div>";
  h+="<button class='big' data-a='usave' data-id='"+(u?u.id:"")+"' type='button'>Salvar</button>";
  if(u&&u.id!=cur.id)h+="<button class='big' data-a='udel' data-id='"+u.id+"' type='button' style='background:var(--line);color:var(--brand)'>🗑 Apagar login</button>";
  sheet(h+"<button class='ghost' data-a='uteam' type='button'>Voltar</button>");
}
$("psheet").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;
  if(a=="uout")logout();
  else if(a=="uteam")team();
  else if(a=="unew")uform(null);
  else if(a=="uedit")uform(users.filter(function(u){return u.id==b.dataset.id})[0]);
  else if(a=="udel"){users=users.filter(function(u){return u.id!=b.dataset.id});saveU();team()}
  else if(a=="usave"){
    var n=$("un").value.trim(),r=$("ur").value,p=$("up").value,er=$("ue"),id=b.dataset.id,u=id?users.filter(function(x){return x.id==id})[0]:null;
    function bad(t){er.textContent=t;er.style.display="block"}
    if(!n)return bad("Digite o nome.");
    if((!u||p)&&!/^\d{4}$/.test(p))return bad("A senha precisa ter 4 números.");
    if(u&&u.id==cur.id&&cur.r=="dono"&&r!="dono"&&users.filter(function(x){return x.r=="dono"}).length<2)return bad("Precisa ficar pelo menos um dono.");
    if(u){u.n=n;u.r=r;if(p)u.p=p}else users.push({id:Date.now(),n:n,r:r,p:p});
    saveU();if(u&&u.id==cur.id)enter(u);team();
  }
});
$("caixa").addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.id=="team")team()});
(function(){var id=null;try{id=sessionStorage.getItem("jp_cur")}catch(e){}var u=users.filter(function(x){return String(x.id)==id})[0];if(u)enter(u);else drawLogin()})();
</script>

<script>
// EDITAR FOTOS (dono e supervisor)
var camK=null;
function itemOf(k){var p=k.split("-");return MENU[p[0]].itens[p[1]]}
function saveF(){try{localStorage.setItem("jp_fotos",JSON.stringify(fotoLocal));return true}catch(e){return false}}
function camSheet(k,msg){camK=k;var it=itemOf(k),f=foto(it[0]),g=MENU[k.split("-")[0]];
  sheet("<h3>📷 "+esc(it[0])+"</h3>"+(f?"<img class='camimg' src='"+f+"' alt=''>":"<p style='color:var(--mut)'>Este item ainda não tem foto.</p>")+(msg?"<div class='troco'>"+msg+"</div>":"")+
  "<label class='big' style='background:var(--brand)'>"+(f?"Trocar foto":"Escolher foto")+"<input id='camf' type='file' accept='image/*' style='display:none'></label>"+
  (f?"<button class='big' data-a='camall' type='button' style='background:var(--ink);color:var(--bg)'>Usar esta foto em toda a seção<br><small style='font-weight:500'>"+esc(g.cat)+"</small></button><button class='big' data-a='camdel' type='button' style='background:var(--line);color:var(--brand)'>Remover foto</button>":"")+
  "<button class='ghost' data-a='x' type='button'>Fechar</button>")}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var S=360,s=Math.max(S/im.width,S/im.height),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement("canvas");c.width=S;c.height=S;c.getContext("2d").drawImage(im,(S-w)/2,(S-h)/2,w,h);cb(c.toDataURL("image/jpeg",.72))};im.onerror=function(){cb(null)};im.src=r.result};r.readAsDataURL(file)}
$("menu").addEventListener("click",function(e){var b=e.target.closest(".cam");if(b)camSheet(b.dataset.cam)});
$("psheet").addEventListener("change",function(e){
  if(e.target.id!="camf"||!e.target.files[0])return;var k=camK,n=itemOf(k)[0],old=fotoLocal[n];
  shrink(e.target.files[0],function(d){
    if(!d){camSheet(k,"Não consegui abrir essa foto. Tente outra.");return}
    fotoLocal[n]=d;if(!saveF()){if(old===undefined)delete fotoLocal[n];else fotoLocal[n]=old;camSheet(k,"Memória do celular cheia para fotos. Remova algumas.");return}
    render();camSheet(k,"✅ Foto salva!")});
});
$("psheet").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;
  if(a=="camdel"){fotoLocal[itemOf(camK)[0]]="";saveF();render();camSheet(camK,"Foto removida.")}
  else if(a=="camall"){var f=foto(itemOf(camK)[0]),bk=JSON.stringify(fotoLocal);MENU[camK.split("-")[0]].itens.forEach(function(it){fotoLocal[it[0]]=f});
    if(!saveF()){fotoLocal=JSON.parse(bk);camSheet(camK,"Memória cheia.");return}render();camSheet(camK,"✅ Foto aplicada em toda a seção.")}
  else if(a=="fexp")exportApp();
});
// Gera um ja-pona.html novo com as fotos gravadas, pra enviar ao GitHub
function exportApp(){
  var mg={},n;for(n in FOTOS)mg[n]=FOTOS[n];for(n in fotoLocal){if(fotoLocal[n])mg[n]=fotoLocal[n];else delete mg[n]}
  sheet("<h3>📤 Salvando app…</h3><p style='color:var(--mut)'>Preparando o arquivo com as fotos.</p>");
  fetch(location.href.split("#")[0].split("?")[0],{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(src){
    var i=src.indexOf("var FOTOS="),j=src.indexOf("; // fotos fixas",i);if(i<0||j<0)throw 0;
    var out=src.slice(0,i)+"var FOTOS="+JSON.stringify(mg)+src.slice(j),file=new File([out],"ja-pona.html",{type:"text/html"});
    function done(){sheet("<h3>✅ Arquivo pronto</h3><p>Agora envie o <b>ja-pona.html</b> para o GitHub (Japona- → ⋯ → Upload files → Commit changes). Em uns 2 minutos, as fotos aparecem em todos os celulares.</p><button class='big' data-a='x' type='button'>Entendi</button>")}
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      sheet("<h3>📤 Arquivo pronto</h3><p>Toque abaixo e escolha <b>Salvar em Arquivos</b>.</p><button class='big' id='shr' type='button'>Salvar ja-pona.html</button><button class='ghost' data-a='x' type='button'>Cancelar</button>");
      $("shr").onclick=function(){navigator.share({files:[file]}).then(done).catch(function(){})};
    }else{var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download="ja-pona.html";document.body.appendChild(a);a.click();a.remove();done()}
  }).catch(function(){sheet("<h3>Não deu para salvar aqui</h3><p>Abra o app pelo link do GitHub (o ícone na tela inicial) e tente de novo, com internet.</p><button class='big' data-a='x' type='button'>OK</button>")});
}
</script>

// Temperos que já vêm de graça (milho, tomate, orégano...) NÃO entram aqui.
var AD_PRECO=4;
var AD_SALG=["Carne","Frango","Queijo","Pizza","Palmito","Catupiry","Cheddar","Ovo","Carne seca","Banana"];
var AD_DOCE=["Chocolate","Chocolate branco","Beijinho","Goiabada","Nutella"];
var AD_ALL=AD_SALG.concat(AD_DOCE.filter(function(n){return AD_SALG.indexOf(n)<0}));
MENU.push({cat:"Adicionais",hide:true,ad:true,itens:AD_ALL.map(function(n){return["Adicional: "+n,"",AD_PRECO,"➕","#cccccc"]})});
var ADG=MENU.length-1,adSel={},adOpen={};
function adKey(n){return ADG+"-"+AD_ALL.indexOf(n)}
function adList(k){var g=MENU[k.split("-")[0]];if(!g||g.ad||/suco|caldo|bebida/i.test(g.cat))return null;return /doce/i.test(g.cat)?AD_DOCE:AD_SALG}
function adSync(){
  AD_ALL.forEach(function(n){delete qty[adKey(n)]});
  Object.keys(adSel).forEach(function(k){var q=qty[k]||0;if(!q||!adSel[k].length){delete adSel[k];return}
    adSel[k].forEach(function(n){var ak=adKey(n);qty[ak]=(qty[ak]||0)+q})});
}
var _adTotals=totals;
totals=function(){var x=_adTotals(),n=x[0];AD_ALL.forEach(function(a){n-=qty[adKey(a)]||0});return[n,x[1]]};
var _adRender=render;
render=function(){
  adSync();_adRender();
  var l="";
  MENU.forEach(function(g,gi){if(g.ad)return;g.itens.forEach(function(it,ii){var k=gi+"-"+ii,q=qty[k]||0;if(!q)return;
    var s=adSel[k]||[],L=adList(k),un=it[2]+s.length*AD_PRECO;
    l+="<div class='line'><div class='n'>"+it[0]+(s.length?"<span class='adt'>+ "+s.join(", ")+"</span>":"")+"<small>"+brl(un*q)+"</small></div>"+stepper(k,q)+"</div><div class='ob'>";
    if(L){
      l+="<button type='button' class='adb"+(s.length?" has":"")+"' data-adt='"+k+"'>"+(s.length?"➕ Adicionais ("+s.length+")  +"+brl(s.length*AD_PRECO*q):"➕ Adicionais  ·  R$ "+AD_PRECO+" cada")+"</button>";
      if(adOpen[k])l+="<div class='adw'><p>Toque para adicionar ou tirar"+(q>1?" (vale para os "+q+")":"")+"</p>"+L.map(function(n){return "<button type='button' data-adk='"+k+"' data-adn='"+n+"' class='"+(s.indexOf(n)>=0?"on":"")+"'>"+(s.indexOf(n)>=0?"✓ ":"+ ")+n+"</button>"}).join("")+"</div>";
    }
    l+="<input type='text' data-o='"+k+"' placeholder='Observação (ex.: sem tomate, sem milho)' value=\""+(obs[k]||"").replace(/"/g,"&quot;")+"\" style='margin-top:8px'><div class='oc'>"+["sem tomate","sem milho","sem cebola","sem ovo"].map(function(x){return "<button type='button' data-ok='"+k+"' data-ov='"+x+"'>"+x+"</button>"}).join("")+"</div></div>";
  })});
  $("lines").innerHTML=l;
};
$("lines").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.adt){var k=b.dataset.adt;adOpen[k]=!adOpen[k];render()}
  else if(b.dataset.adk){var k=b.dataset.adk,n=b.dataset.adn,s=adSel[k]||(adSel[k]=[]),i=s.indexOf(n);if(i>=0)s.splice(i,1);else s.push(n);render()}
});
var _adSend=$("send").onclick;
$("send").onclick=function(){
  adSync();var bk={};Object.keys(obs).forEach(function(k){bk[k]=obs[k]});
  Object.keys(adSel).forEach(function(k){var t="+ "+adSel[k].join(" + ");obs[k]=obs[k]?t+" | "+obs[k]:t});
  _adSend.apply(this,arguments);
  if($("ticket").style.display=="block"){$("paper").innerHTML=$("paper").innerHTML.replace(/\d+x Adicional: [^\n<]*\n/g,"")}
  else obs=bk;
};
var _adClear=$("clear").onclick;$("clear").onclick=function(){adSel={};adOpen={};_adClear.apply(this,arguments)};
var _adFinish=finish;finish=function(){adSel={};adOpen={};_adFinish.apply(this,arguments)};
$("done").onclick=finish;
render();
</script>

.views{display:flex!important;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 12px!important}
.views::-webkit-scrollbar{display:none}
.views button{flex:1 0 auto;white-space:nowrap;padding:10px 12px!important;font-size:15px;line-height:1.2;border-radius:12px}
.hero h1{font-size:20px}
</style>

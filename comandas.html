button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0}
.hd{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.hd img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.hd h1{margin:0;font-size:19px;flex:1}.hd h1 small{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:13px}
.av.dono{background:#d23c2f}.av.sup{background:#e8890c}.av.func{background:#2f9e44}
.tabs{display:flex;gap:8px;max-width:760px;margin:10px auto 0}
.tabs button{flex:1;padding:11px 8px;border:0;border-bottom:3px solid transparent;background:none;font-weight:800;color:var(--mut);white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:620px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kp small{display:block;color:var(--mut);font-size:13px;font-weight:600}.kp b{font-size:21px;display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.filt{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.filt button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.filt button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cg{display:grid;gap:10px}@media(min-width:620px){.cg{grid-template-columns:1fr 1fr}}
.cm{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:16px;padding:14px}
.cm.lv{border-left-color:var(--warn)}.cm.pd{border-left-color:var(--ok)}
.cm .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cm .r1 b{font-size:18px}.cm .r1 span{color:var(--mut);font-size:13.5px;white-space:nowrap}.cm .r1 span.late{color:var(--brand);font-weight:800}
.cm .it{color:var(--mut);font-size:14px;margin:6px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm .r2{display:flex;justify-content:space-between;align-items:center}
.cm .r2 strong{font-size:20px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;background:var(--brand)}.tag.lv{background:var(--warn)}.tag.pd{background:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:50px 10px}.empty b{display:block;font-size:46px;margin-bottom:6px}
.veil{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:92%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:21px}.sub{color:var(--mut);margin:0 0 10px;font-size:14px}
.line{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}.line .n small{display:block;color:var(--mut)}.line b{font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:14px 0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.chips button{padding:15px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.chips button.on{border-color:var(--brand);background:var(--brand);color:#fff}
input[type=text],input[type=password]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;margin:4px 0 6px}
.big{width:100%;padding:16px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:18px;font-weight:800;margin-top:8px}
.big:disabled{opacity:.4}
.ghost{width:100%;background:none;border:0;color:var(--mut);padding:12px;text-decoration:underline}
.troco{background:var(--bg);border-radius:12px;padding:12px;margin:8px 0;font-weight:800;font-size:18px}
.dsel{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.dsel b{font-size:18px}.dsel button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}.dsel button:disabled{opacity:.3}
.ch{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 4px 8px;font-weight:700}
.pan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.pan .line:last-child{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.hist{cursor:pointer}
#login{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
.lg{width:100%;max-width:400px;text-align:center}
.lg img{width:104px;height:104px;border-radius:50%;object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.lg h1{margin:12px 0 2px;font-size:24px}.lg>p{margin:0 0 20px;color:var(--mut)}
.ulist{display:grid;gap:10px;text-align:left}
.ulist button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:17px}
.ulist .av{width:42px;height:42px;font-size:17px}.ulist small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--brand);border-color:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{padding:18px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:700}
.lerr{color:var(--brand);font-weight:700;min-height:22px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);font-weight:800}.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.off{color:var(--mut)}.live.off i{background:var(--mut)}
</style>

var $=function(i){return document.getElementById(i)};
var brl=function(v){return "R$ "+(v||0).toFixed(2).replace(".",",")};
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ini(n){return esc(String(n).trim().charAt(0).toUpperCase()||"?")}
var RN={dono:"Dono",sup:"Supervisor",func:"Funcionário"};
var users=[],acc={},lv=[],sales=[],sai=[],cur=null,lsel=null,lpin="",view="c",filt="todas",day=new Date(),pay=null,FB=null;
function lines(o){var a=[];Object.keys(o||{}).forEach(function(k){var p=k.split("-"),it=(MENU[p[0]]||{itens:[]}).itens[p[1]];a.push(it?[it[0],o[k],it[2],k]:["Item",o[k],0,k])});return a}
function tTot(o){var t=0;lines(o).forEach(function(l){t+=l[1]*l[2]});return t}
function hm(t){var d=new Date(t);return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function mins(t){var m=Math.floor((Date.now()-t)/60000);return m<1?"agora":m<60?"há "+m+" min":"há "+Math.floor(m/60)+"h"+("0"+m%60).slice(-2)}
var DN=["dom","seg","ter","qua","qui","sex","sáb"];
function dl(d){return DN[d.getDay()]+" "+("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)}
function ds(t){return new Date(t).toDateString()}
function sum(a){var t=0;a.forEach(function(x){t+=x.v});return t}
function sheet(h){$("sheet").innerHTML=h;$("veil").style.display="block"}
function closeSheet(){$("veil").style.display="none";pay=null}
$("veil").addEventListener("click",function(e){if(e.target.id=="veil")closeSheet()});
$("tlogo").src=LOGO;

// ---- comandas abertas
function comandas(){var a=[];
  Object.keys(acc).forEach(function(n){var m=acc[n];if(m&&m.items&&Object.keys(m.items).length)a.push({tipo:"mesa",id:String(n),nome:"Mesa "+n,t:m.t,o:m.items,obs:m.obs||{},pd:false})});
  lv.forEach(function(x){a.push({tipo:"levar",id:String(x.id),nome:x.n,t:x.t,o:x.o,obs:x.obs||{},pd:!!x.pd})});
  return a.sort(function(x,y){return x.t-y.t})}
function renderC(){
  var all=comandas(),aRec=0;all.forEach(function(c){if(!c.pd)aRec+=tTot(c.o)});
  var nm=all.filter(function(c){return c.tipo=="mesa"}).length,nl=all.length-nm;
  var h="<div class='kp'><div><small>Comandas abertas</small><b>"+all.length+"</b></div><div><small>A receber agora</small><b style='color:var(--brand)'>"+brl(aRec)+"</b></div><div><small>Mesas</small><b>"+nm+"</b></div><div><small>Para levar</small><b>"+nl+"</b></div></div>";
  h+="<div class='filt'>"+[["todas","Todas"],["mesa","🍽️ Mesas"],["levar","🛍️ Levar"],["pagar","💰 A pagar"]].map(function(f){return "<button data-f='"+f[0]+"' class='"+(filt==f[0]?"on":"")+"' type='button'>"+f[1]+"</button>"}).join("")+"</div>";
  var l=all.filter(function(c){return filt=="todas"||(filt=="pagar"?!c.pd:c.tipo==filt)});
  if(!l.length)h+="<div class='empty'><b>🧾</b>Nenhuma comanda "+(filt=="todas"?"aberta":"aqui")+" agora.</div>";
  else{h+="<div class='cg'>";l.forEach(function(c){var m=(Date.now()-c.t)/60000,it=lines(c.o);
    h+="<button class='cm"+(c.tipo=="levar"?" lv":"")+(c.pd?" pd":"")+"' data-c='"+c.tipo+":"+esc(c.id)+"' type='button'><div class='r1'><b>"+(c.tipo=="mesa"?"🍽️ ":"🛍️ ")+esc(c.nome)+"</b><span class='"+(m>=30?"late":"")+"'>"+hm(c.t)+" · "+mins(c.t)+"</span></div><div class='it'>"+it.map(function(x){return x[1]+"x "+esc(x[0])}).join(" · ")+"</div><div class='r2'><span class='tag"+(c.pd?" pd":c.tipo=="levar"?" lv":"")+"'>"+(c.pd?"PAGO":c.tipo=="mesa"?"MESA ABERTA":"A PAGAR")+"</span><strong>"+brl(tTot(c.o))+"</strong></div></button>"});h+="</div>"}
  $("main").innerHTML=h;
}
function findC(key){var p=key.split(":"),t=p[0],id=p.slice(1).join(":");return comandas().filter(function(c){return c.tipo==t&&c.id==id})[0]}
function openC(key){var c=findC(key);if(!c){closeSheet();return}
  var h="<h3>"+(c.tipo=="mesa"?"🍽️ ":"🛍️ ")+esc(c.nome)+"</h3><p class='sub'>Aberta às "+hm(c.t)+" · "+mins(c.t)+(c.tipo=="levar"?" · para levar":"")+"</p>";
  lines(c.o).forEach(function(l){h+="<div class='line'><div class='n'>"+l[1]+"x "+esc(l[0])+(c.obs[l[3]]?"<small>📝 "+esc(c.obs[l[3]])+"</small>":"")+"</div><b>"+brl(l[1]*l[2])+"</b></div>"});
  h+="<div class='sum'><span>Total</span><span>"+brl(tTot(c.o))+"</span></div>";
  if(!c.pd)h+="<button class='big' data-a='cobrar' data-k='"+esc(key)+"' type='button'>💰 Cobrar "+brl(tTot(c.o))+"</button>";
  if(c.tipo=="levar")h+="<button class='big' data-a='entregue' data-k='"+esc(key)+"' type='button' style='background:"+(c.pd?"var(--ok)":"var(--line);color:var(--ink)")+"'>✅ Entregue ao cliente</button>";
  sheet(h+"<button class='ghost' data-a='x' type='button'>Fechar</button>");
}
function drawPay(){var c=findC(pay.key);if(!c){closeSheet();return}pay.tot=tTot(c.o);
  var h="<h3>💰 Cobrar · "+esc(c.nome)+"</h3><div class='sum'><span>Total</span><span>"+brl(pay.tot)+"</span></div><b>Forma de pagamento</b><div class='chips'>";
  ["Dinheiro","Pix","Crédito","Débito"].forEach(function(m){h+="<button data-a='m' data-v='"+m+"' class='"+(pay.m==m?"on":"")+"' type='button'>"+m+"</button>"});
  h+="</div>";if(pay.m=="Dinheiro")h+="<input id='rec' type='text' inputmode='decimal' placeholder='Valor recebido (R$)' value='"+esc(pay.rec)+"'><div class='troco' id='troco'></div>";
  h+="<button class='big' data-a='ok' type='button'"+(pay.m?"":" disabled")+">Confirmar pagamento</button><button class='ghost' data-a='back' type='button'>Voltar</button>";
  sheet(h);drawTroco();}
function recv(){return parseFloat((pay.rec||"").replace(",","."))||0}
function drawTroco(){var t=$("troco");if(!t)return;var v=recv();t.textContent=v>=pay.tot&&v?"Troco: "+brl(v-pay.tot):(v?"Faltam "+brl(pay.tot-v):"Troco: R$ 0,00")}
function confirmPay(){var c=findC(pay.key);if(!c)return closeSheet();var v=recv();if(pay.m=="Dinheiro"&&v&&v<pay.tot)return drawTroco();
  var tr=pay.m=="Dinheiro"&&v?v-pay.tot:0,t=Date.now(),id=t+"-"+Math.random().toString(36).slice(2,7);
  var venda={id:id,v:pay.tot,m:pay.m,t:t,w:c.tipo=="mesa"?c.nome:"LEVAR: "+String(c.nome).toUpperCase(),u:cur.n,o:c.o,obs:c.obs};
  var db=FB.db;db.collection("vendas").doc(id).set(clean(venda)).catch(onErr);
  if(c.tipo=="mesa")db.collection("mesas").doc(c.id).delete().catch(onErr);else db.collection("levar").doc(c.id).set({pd:true},{merge:true}).catch(onErr);
  sheet("<h3>✅ Pagamento recebido</h3><p>"+esc(c.nome)+" · "+pay.m+" · <b>"+brl(pay.tot)+"</b></p>"+(tr>0?"<div class='troco'>Dar de troco: "+brl(tr)+"</div>":"")+(c.tipo=="levar"?"<p class='sub'>O pedido continua na lista até ser entregue.</p>":"")+"<button class='big' data-a='x' type='button'>Pronto</button>");pay=null;}
$("sheet").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;
  if(a=="x")closeSheet();
  else if(a=="cobrar"){pay={key:b.dataset.k,m:"",rec:""};drawPay()}
  else if(a=="m"){pay.m=b.dataset.v;drawPay()}
  else if(a=="back"){var k=pay.key;pay=null;openC(k)}
  else if(a=="ok")confirmPay();
  else if(a=="entregue"){var c=findC(b.dataset.k);if(!c)return closeSheet();
    if(!c.pd&&!b.dataset.sure){b.dataset.sure=1;b.textContent="Ainda não foi pago! Toque de novo para entregar assim";b.style.background="var(--brand)";b.style.color="#fff";return}
    FB.db.collection("levar").doc(c.id).delete().catch(onErr);closeSheet()}
  else if(a=="sok"){var x=parseFloat($("sv").value.replace(",","."));if(!x||x<=0)return;var t=isHoje()?Date.now():new Date(day.getFullYear(),day.getMonth(),day.getDate(),12).getTime();
    FB.db.collection("saidas").doc(String(t)).set({v:x,d:$("sd").value.trim()||"Saída",t:t}).catch(onErr);closeSheet()}
  else if(a=="sdel"){FB.db.collection("saidas").doc(b.dataset.id).delete().catch(onErr);closeSheet()}
});
$("sheet").addEventListener("input",function(e){if(e.target.id=="rec"&&pay){pay.rec=e.target.value;drawTroco()}});
$("main").addEventListener("click",function(e){var b=e.target.closest("button"),r=e.target.closest(".hist");
  if(b&&b.dataset.c)openC(b.dataset.c);
  else if(b&&b.dataset.f){filt=b.dataset.f;renderC()}
  else if(b&&b.dataset.d){day=new Date(day.getTime()+Number(b.dataset.d)*864e5);renderR()}
  else if(b&&b.id=="newS")sheet("<h3>Lançar saída</h3><input id='sd' type='text' placeholder='O que foi? (ex.: massa, gás)' autocomplete='off'><input id='sv' type='text' inputmode='decimal' placeholder='Valor (R$)'><button class='big' data-a='sok' type='button' style='background:var(--brand)'>Salvar saída</button><button class='ghost' data-a='x' type='button'>Cancelar</button>");
  else if(b&&b.dataset.sd){var s=sai.filter(function(x){return String(x.t)==b.dataset.sd})[0];if(s)sheet("<h3>Apagar saída?</h3><p>"+esc(s.d)+" · <b>"+brl(s.v)+"</b></p><button class='big' data-a='sdel' data-id='"+esc(b.dataset.sd)+"' type='button' style='background:var(--brand)'>Apagar</button><button class='ghost' data-a='x' type='button'>Cancelar</button>")}
  else if(r){day=new Date(Number(r.dataset.t));renderR();window.scrollTo(0,0)}
});

// ---- resumo de vendas
function isHoje(){return day.toDateString()==new Date().toDateString()}
function dayData(d){var k=d.toDateString(),e=sales.filter(function(s){return ds(s.t)==k}),s=sai.filter(function(x){return ds(x.t)==k});return{e:e,s:s,te:sum(e),ts:sum(s)}}
function renderR(){
  var D=dayData(day),hoje=isHoje(),n=D.e.length;
  var h="<div class='dsel'><button data-d='-1' type='button'>‹</button><b>"+(hoje?"Hoje · ":"")+dl(day)+"</b><button data-d='1' type='button'"+(hoje?" disabled":"")+">›</button></div>";
  h+="<div class='kp'><div><small>Vendido</small><b style='color:var(--ok)'>"+brl(D.te)+"</b></div><div><small>Saídas</small><b style='color:var(--brand)'>"+brl(D.ts)+"</b></div><div><small>Saldo do dia</small><b>"+brl(D.te-D.ts)+"</b></div><div><small>Vendas · ticket médio</small><b>"+n+" · "+brl(n?D.te/n:0)+"</b></div></div>";
  h+="<div class='ch'>Por forma de pagamento</div><div class='pan'>";
  ["Dinheiro","Pix","Crédito","Débito"].forEach(function(m){var v=sum(D.e.filter(function(x){return x.m==m}));h+="<div class='line'><div class='n'>"+m+"<div class='bar'><i style='width:"+(D.te?Math.round(v/D.te*100):0)+"%'></i></div></div><b>"+brl(v)+"</b></div>"});
  h+="</div>";
  var it={};D.e.forEach(function(s){lines(s.o).forEach(function(l){it[l[0]]=(it[l[0]]||0)+l[1]})});var top=Object.keys(it).sort(function(a,b){return it[b]-it[a]}).slice(0,6);
  if(top.length){h+="<div class='ch'>Mais vendidos</div><div class='pan'>";top.forEach(function(k){h+="<div class='line'><div class='n'>"+esc(k)+"</div><b>"+it[k]+"x</b></div>"});h+="</div>"}
  var at={};D.e.forEach(function(s){var u=s.u||"—";at[u]=at[u]||[0,0];at[u][0]+=s.v;at[u][1]++});var ak=Object.keys(at).sort(function(a,b){return at[b][0]-at[a][0]});
  if(ak.length){h+="<div class='ch'>Por atendente</div><div class='pan'>";ak.forEach(function(k){h+="<div class='line'><div class='n'>👤 "+esc(k)+"<small>"+at[k][1]+(at[k][1]==1?" venda":" vendas")+"</small></div><b>"+brl(at[k][0])+"</b></div>"});h+="</div>"}
  h+="<button class='big' id='newS' type='button' style='background:var(--brand);margin-top:16px'>➖ Lançar saída</button>";
  var mv=D.e.map(function(x){return{t:x.t,n:esc(x.w||"Venda")+" · "+x.m+(x.u?" · 👤 "+esc(x.u):""),v:x.v}}).concat(D.s.map(function(x){return{t:x.t,n:esc(x.d),v:-x.v,id:x.t}}));mv.sort(function(a,b){return b.t-a.t});
  h+="<div class='ch'>Movimentos do dia</div><div class='pan'>";if(!mv.length)h+="<p style='color:var(--mut);margin:10px 0'>Nada lançado neste dia.</p>";
  mv.forEach(function(m){h+="<div class='line'><div class='n'>"+m.n+"<small>"+hm(m.t)+"</small></div><b style='color:"+(m.v<0?"var(--brand)":"var(--ok)")+"'>"+(m.v<0?"− ":"+ ")+brl(Math.abs(m.v))+"</b>"+(m.v<0?"<button data-sd='"+m.id+"' type='button' style='border:0;background:none;color:var(--mut);font-size:18px;padding:0 0 0 6px'>✕</button>":"")+"</div>"});
  h+="</div><div class='ch'>Últimos 7 dias</div><div class='pan'>";
  for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var q=dayData(d);h+="<div class='line hist' data-t='"+d.getTime()+"'><div class='n'>"+dl(d)+"<small>"+q.e.length+" vendas"+(q.ts?" · saídas "+brl(q.ts):"")+"</small></div><b>"+brl(q.te-q.ts)+"</b></div>"}
  $("main").innerHTML=h+"</div>";
}
function render(){if(!cur)return;if(view=="c")renderC();else renderR();$("tC").className=view=="c"?"on":"";$("tR").className=view=="r"?"on":"";
  var n=comandas().length;$("tC").textContent="🧾 Comandas"+(n?" ("+n+")":"")}
$("tC").onclick=function(){view="c";render();window.scrollTo(0,0)};$("tR").onclick=function(){view="r";day=new Date();render();window.scrollTo(0,0)};
setInterval(function(){if(cur&&view=="c"&&$("veil").style.display!="block")renderC()},30000);

// ---- login (só dono e supervisor)
function bosses(){return users.filter(function(u){return u.r=="dono"||u.r=="sup"})}
function drawLogin(){var h="<div class='lg'><img src='"+LOGO+"' alt=''><h1>Comandas</h1>";
  var b=bosses();
  if(!b.length)h+="<p>Nenhum dono ou supervisor cadastrado ainda. Crie os logins pelo app de pedidos.</p>";
  else if(!lsel){h+="<p>Só dono e supervisor. Quem está entrando?</p><div class='ulist'>";b.forEach(function(u){h+="<button type='button' data-u='"+u.id+"'><span class='av "+u.r+"'>"+ini(u.n)+"</span><span>"+esc(u.n)+"<small>"+RN[u.r]+"</small></span></button>"});h+="</div>"}
  else{h+="<p>Olá, <b>"+esc(lsel.n)+"</b>! Digite sua senha.</p><div class='dots'>";for(var i=0;i<4;i++)h+="<i class='"+(i<lpin.length?"f":"")+"'></i>";
    h+="</div><div class='lerr' id='le'></div><div class='pad'>";[1,2,3,4,5,6,7,8,9,"⌫",0,"↩"].forEach(function(k){h+="<button type='button' data-k='"+k+"'>"+k+"</button>"});h+="</div><button class='ghost' data-k='↩' type='button'>Trocar de usuário</button>"}
  $("login").innerHTML=h+"</div>";$("login").style.display="flex";$("top").style.display="none";$("main").innerHTML=""}
$("login").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.dataset.mb!=null)return;
  if(b.dataset.u){lsel=users.filter(function(u){return u.id==b.dataset.u})[0];lpin="";drawLogin();return}
  var k=b.dataset.k;if(k==null)return;if(k=="↩"){lsel=null;lpin="";drawLogin();return}if(k=="⌫"){lpin=lpin.slice(0,-1);drawLogin();return}
  if(lpin.length<4)lpin+=k;drawLogin();if(lpin.length==4){if(lpin==lsel.p)enter(lsel);else{lpin="";drawLogin();$("le").textContent="Senha incorreta."}}});
function enter(u){cur=u;lsel=null;lpin="";try{sessionStorage.setItem("jp_cmd_cur",u.id)}catch(e){}$("login").style.display="none";$("top").style.display="block";
  $("me").innerHTML="<span class='av "+u.r+"'>"+ini(u.n)+"</span>"+esc(String(u.n).split(" ")[0]);render()}
$("me").onclick=function(){sheet("<h3>👤 "+esc(cur.n)+"</h3><p class='sub'>"+RN[cur.r]+"</p><button class='big' data-a='x' type='button' style='background:var(--line);color:var(--ink)'>Fechar</button><button class='big' id='sair' type='button' style='background:var(--brand)'>Sair</button>");
  $("sair").onclick=function(){cur=null;closeSheet();try{sessionStorage.removeItem("jp_cmd_cur")}catch(e){}drawLogin()}};
function startLogin(){var id=null;try{id=sessionStorage.getItem("jp_cmd_cur")}catch(e){}var u=bosses().filter(function(x){return String(x.id)==id})[0];if(u)enter(u);else drawLogin()}
</script>
<script>

var SHOP_EMAIL="loja@japona.app",FBV="10.12.2";
function fbLoad(cb){
  if(window.firebase&&firebase.firestore)return cb(true);
  var L=["app","auth","firestore"],i=0,done=false,tm=setTimeout(function(){if(!done){done=true;cb(false)}},12000);
  (function nx(){if(i>=L.length){if(!done){done=true;clearTimeout(tm);cb(true)}return}
    var s=document.createElement("script");s.src="https://www.gstatic.com/firebasejs/"+FBV+"/firebase-"+L[i++]+"-compat.js";
    s.onload=nx;s.onerror=function(){if(!done){done=true;clearTimeout(tm);cb(false)}};document.head.appendChild(s)})();
}
function fbInit(){if(!firebase.apps.length)firebase.initializeApp(FB_CFG);var d=firebase.firestore();try{d.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}return{auth:firebase.auth(),db:d}}
function clean(o){return JSON.parse(JSON.stringify(o))}
function fbErr(e){var c=(e&&e.code)||"";
  if(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(c))return "Senha da loja incorreta.";
  if(/operation-not-allowed/.test(c))return "No Firebase, ative E-mail/senha em Authentication.";
  if(/too-many/.test(c))return "Muitas tentativas. Espere um pouco.";
  if(/network/.test(c))return "Sem internet. Tente de novo.";

  return "Erro: "+(c||e);}
function shopScreen(el,logo,title,onTry){

  el.style.display="flex";
  var go=function(){var p=document.getElementById("shp").value;if(!p)return;document.getElementById("shb").textContent="Conectando…";onTry(p,function(msg){document.getElementById("she").textContent=msg;document.getElementById("shb").textContent="Conectar"})};
  document.getElementById("shb").onclick=go;document.getElementById("shp").onkeydown=function(e){if(e.key=="Enter")go()};
}
function msgScreen(el,logo,title,msg,btns){

  el.style.display="flex";el.querySelectorAll("[data-mb]").forEach(function(x){x.onclick=btns[+x.dataset.mb][1]});
}

// ---- COMANDAS: escuta o banco ao vivo
function onErr(e){console.log("fb",e);var l=$("live");l.className="live off";l.innerHTML="<i></i>"+esc(fbErr(e))}
function refresh(){
  if(cur){var me=users.filter(function(u){return u.id==cur.id})[0];if(!me||(me.r!="dono"&&me.r!="sup")){cur=null;closeSheet();drawLogin();return}cur=me}
  else if(!lsel&&$("login").style.display!="none"&&started)drawLogin();
  if(!cur)return;
  if($("veil").style.display=="block"){if(pay)drawPay();else{var k=$("sheet").querySelector("[data-k]");if(k&&!findC(k.dataset.k))closeSheet()}}
  render()}
var started=false;
function listen(){var db=FB.db,got=0;function ready(){if(++got==5&&!started){started=true;startLogin()}}
  function sub(q,apply){var f=0;q.onSnapshot(function(s){apply(s);var l=$("live");l.className="live";l.innerHTML="<i></i>ao vivo";if(!f){f=1;ready()}else refresh()},onErr)}
  sub(db.doc("loja/config"),function(d){users=d.exists?(d.data().users||[]):[]});
  sub(db.collection("mesas"),function(s){acc={};s.forEach(function(d){var x=d.data();acc[x.n||d.id]=x})});
  sub(db.collection("levar"),function(s){lv=[];s.forEach(function(d){var x=d.data();if(!x.id)x.id=d.id;lv.push(x)})});
  var since=Date.now()-62*864e5;
  sub(db.collection("vendas").where("t",">=",since),function(s){sales=[];s.forEach(function(d){sales.push(d.data())})});
  sub(db.collection("saidas").where("t",">=",since),function(s){sai=[];s.forEach(function(d){sai.push(d.data())})});
}
function boot(){var L=$("login"),T="Comandas";msgScreen(L,LOGO,T,"Conectando à loja…",[]);
  fbLoad(function(ok){if(!ok)return msgScreen(L,LOGO,T,"Sem internet. As comandas precisam de internet para aparecer ao vivo.",[["Tentar de novo",boot]]);
    try{FB=fbInit()}catch(e){return msgScreen(L,LOGO,T,fbErr(e),[["Tentar de novo",boot]])}
    var on=false;FB.auth.onAuthStateChanged(function(u){if(u){if(!on){on=true;msgScreen(L,LOGO,T,"Carregando comandas…",[]);listen()}}
      else shopScreen(L,LOGO,T,function(p,fail){FB.auth.signInWithEmailAndPassword(SHOP_EMAIL,p).catch(function(e){fail(fbErr(e))})})})})}
boot();
</script>
